# Kafka Consumer Configuration
# Used for Kafka CVEs requiring consumer-specific settings
# This file is conditionally included when kafka_role = "consumer" or "both"

bootstrap.servers={{ kafka_bootstrap_servers | default("localhost:9092") }}

# Consumer group
group.id={{ kafka_consumer_group | default("vuln-consumer-group") }}

# Offset management
auto.offset.reset={{ kafka_auto_offset_reset | default("earliest") }}
enable.auto.commit={{ kafka_enable_auto_commit | default("true") }}
auto.commit.interval.ms={{ kafka_auto_commit_interval | default(1000) }}

# Deserialization
key.deserializer={{ kafka_key_deserializer | default("org.apache.kafka.common.serialization.StringDeserializer") }}
value.deserializer={{ kafka_value_deserializer | default("org.apache.kafka.common.serialization.StringDeserializer") }}

# Fetch settings
fetch.min.bytes={{ kafka_fetch_min_size | default(1) }}
fetch.max.wait.ms={{ kafka_fetch_max_wait | default(500) }}
max.poll.records={{ kafka_max_poll_records | default(500) }}
max.partition.fetch.bytes={{ kafka_max_partition_fetch_bytes | default(1048576) }}

# Security (if needed for CVEs)
security.protocol={{ kafka_security_protocol | default("PLAINTEXT") }}

# Session timeout
session.timeout.ms={{ kafka_session_timeout | default(10000) }}
heartbeat.interval.ms={{ kafka_heartbeat_interval | default(3000) }}

# Comments for vulnerability triggering:
# - Set enable.auto.commit to "false" for offset manipulation CVEs
# - Set max.poll.records to very high value for memory exhaustion CVEs
# - Use custom deserializers for deserialization CVEs
