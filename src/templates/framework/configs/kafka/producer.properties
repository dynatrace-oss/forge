# Kafka Producer Configuration
# Used for Kafka CVEs requiring producer-specific settings
# This file is conditionally included when kafka_role = "producer" or "both"

bootstrap.servers={{ kafka_bootstrap_servers | default("localhost:9092") }}

# Producer settings
acks={{ kafka_producer_acks | default("all") }}
retries={{ kafka_producer_retries | default(3) }}
batch.size={{ kafka_batch_size | default(16384) }}
linger.ms={{ kafka_linger_ms | default(1) }}
buffer.memory={{ kafka_buffer_memory | default(33554432) }}

# Serialization
key.serializer={{ kafka_key_serializer | default("org.apache.kafka.common.serialization.StringSerializer") }}
value.serializer={{ kafka_value_serializer | default("org.apache.kafka.common.serialization.StringSerializer") }}

# Compression (set to vulnerable codec for CVEs: gzip, snappy, lz4, zstd)
compression.type={{ kafka_compression_type | default("none") }}

# Request size (set to unlimited for payload CVEs)
max.request.size={{ kafka_max_request_size | default(1048576) }}

# Security (if needed for CVEs)
security.protocol={{ kafka_security_protocol | default("PLAINTEXT") }}

# Timeout settings
request.timeout.ms={{ kafka_request_timeout | default(30000) }}
delivery.timeout.ms={{ kafka_delivery_timeout | default(120000) }}

# Comments for vulnerability triggering:
# - Set compression.type to "gzip", "snappy", "lz4", or "zstd" for compression CVEs
# - Set max.request.size to Integer.MAX_VALUE for payload size CVEs
# - Set acks to "0" for async fire-and-forget CVEs
