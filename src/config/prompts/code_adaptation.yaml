metadata:
  name: 'code_adaptation'
  version: '2.0.0'
  description: 'Adapt code for specific framework'
  category: 'framework'
  author: 'FORGE Framework'
  last_updated: '2025-11-03'
  extends: base_code_adaptation
  tags:
  - framework
