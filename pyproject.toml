[project]
name = "forge"
version = "0.1.0"
description = "Template-Driven Multi-Agent Framework for Automated Vulnerability Exploitability Assessment"
requires-python = ">=3.12"
dependencies = [
    # LLM orchestration & token measurement
    "litellm>=1.60",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",    # Optional: for Jaeger export
    # Data processing & analysis
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    # YAML/JSON template handling
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "jinja2>=3.1",
    # Container runtime (Podman + Kind K8s)
    "podman>=5.0",
    "kubernetes>=31.0",
    # HTTP & API clients (EPSS, NVD, etc.)
    "httpx>=0.28",
    # CLI & utilities
    "click>=8.1",
    "rich>=13.9",
    "python-dotenv>=1.0",
    "scipy-stubs>=1.17.1.4",
    # Detection rule validation
    "pysigma>=0.11",
    "idstools>=0.6",
    # AWS Bedrock LLM provider (litellm uses boto3 for all Bedrock calls)
    "boto3>=1.39",
]

[project.scripts]
forge = "forge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]
monitoring = [
    "streamlit>=1.40",
    "plotly>=5.24",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["E402", "E501"]
"tests/test_driver.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pandas", "plotly.*", "streamlit", "streamlit.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_any_generics = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration and not network'"
markers = [
    "network: tests that hit real external APIs (deselect with -m 'not network')",
    "integration: tests that require Podman/Kind and pull real container images",
    "artifacts: tests that require forge-artifacts knowledge base cloned alongside",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "types-pyyaml>=6.0.12.20260408",
    "ruff>=0.8",
    "mypy>=1.13",
]
