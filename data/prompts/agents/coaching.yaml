reconnaissance: |
  You have made no exploitation progress after several turns. Step back and reconsider your approach.

  Suggestions:
  1. Re-read the vulnerability description and identify the exact vulnerable component.
  2. Use read_file to examine the vulnerable source code path.
  3. Use http_request to probe endpoints and map the attack surface.
  4. Check application logs with get_app_logs for useful error messages.
  {% if intel_summary or attack_plan %}
  Review the intel summary and attack plan in your initial instructions for specific entry points and vulnerable endpoints.
  {% endif %}

escalation: |
  You have reached L{{ current_level }} but are stuck. The vulnerability is triggered — now escalate the exploitation.

  Suggestions:
  1. Analyze the error/crash you triggered to understand the root cause.
  2. Craft a more precise payload targeting the specific vulnerability type.
  3. Try different injection techniques or encoding variations.
  4. Check if the application has input validation you need to bypass.
  {% if attack_plan %}
  Review the escalation paths in the attack plan from your initial instructions for specific techniques.
  {% endif %}

deep_exploitation: |
  You have confirmed exploitation at L{{ current_level }}. Push for deeper impact — weaponize the vulnerability.

  Suggestions:
  1. Chain the confirmed vulnerability with file read/write primitives.
  2. Attempt command injection through the confirmed entry point.
  3. Try to read sensitive files (/etc/passwd, .env, config files).
  4. If you have code execution, establish persistence or exfiltrate data.
  {% if patch_analysis %}
  Refer to the patch analysis in your initial instructions for details on what was fixed and how to target the vulnerable code path.
  {% endif %}

error_recovery: |
  You have encountered multiple consecutive errors. Stop and diagnose before retrying.

  Suggestions:
  1. Check if the target application is still running (use http_request to /health or /).
  2. Verify you are using the correct target URL and port.
  3. If a command failed, check that the tool/binary exists in the exploit container.
  4. Simplify your approach — try a basic request before complex payloads.
  {% if recent_errors %}

  Recent errors:
  {% for err in recent_errors[-3:] %}  - {{ err[:200] }}
  {% endfor %}{% endif %}
